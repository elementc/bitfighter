# Publishes the Emscripten browser build to GitHub Pages.
# Triggers only for this branch, so upstream's master/PR workflows stay idle.
name: Emscripten Pages

on:
  push:
    branches:
      - emscripten-poc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emscripten-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten 7.0.0
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          # Compiled ports (SDL2, libpng, zlib) land here and are reused.
          actions-cache-folder: upstream/emscripten/cache

      - name: Build
        run: |
          mkdir -p build/emscripten
          cd build/emscripten
          emcmake cmake ../.. -DCMAKE_BUILD_TYPE=Release
          emmake make -j"$(nproc)"

      - name: Stage site
        run: |
          mkdir -p site
          cp exe/bitfighter.html site/index.html
          cp exe/bitfighter.html site/bitfighter.html
          cp exe/bitfighter.js exe/bitfighter.wasm exe/bitfighter.data site/
          ls -lh site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
