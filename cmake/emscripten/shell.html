<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Bitfighter</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten { font-family: monospace; width: 80%; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; display: block; width: 100%; height: calc(100vh - 11rem); }
      p.hint { text-align: center; font-size: 14px; margin: 8px; }
      #toolbar { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 6px 10px; background: #1b1b1b; }
      #toolbar button { background: #163; color: #efe; border: 1px solid #3a6; padding: 6px 14px; font: inherit; cursor: pointer; }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(0,150,240);
        border-right: 10px solid rgb(0,150,240);
        border-bottom: 10px solid rgb(0,150,240);
        border-top: 10px solid rgb(100,0,200);
        border-radius: 100%;
        background-color: rgb(200,100,250);
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }
    </style>
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
    <div id="toolbar">
      <button id="fullscreen" type="button">Fullscreen</button>
      <span class="hint">Click HOST GAME, then START HOSTING. UDP uses wss://bitfighter-relay.onrender.com unless you pass ?relay=ws://host:port or ?relay=off. H is in-game help.</span>
    </div>
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea class="emscripten" id="output" rows="8"></textarea>
    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      document.getElementById('fullscreen').addEventListener('click', function () {
        var target = document.getElementById('canvas');
        if (target.requestFullscreen)
          target.requestFullscreen();
        else if (target.webkitRequestFullscreen)
          target.webkitRequestFullscreen();
      });

      canvasElement.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      function setStatus(text) {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2])*100;
          progressElement.max = parseInt(m[4])*100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.hidden = true;
        }
        statusElement.innerHTML = text;
      }

      // ?name= skips nickname entry (the LAN test). With no name, the normal
      // first-run screen is shown. A saved name comes back from IDBFS.
      // ?master= replaces the master list so a LAN test never dials out.
      var gameArgs = [];
      try {
        var params = new URLSearchParams(window.location.search);
        var playerName = params.get('name');
        if (playerName)
          gameArgs.push('-name', playerName);
        var master = params.get('master');
        if (master)
          gameArgs.push('-master', master);
      } catch (e) {}

#if MODULARIZE && !EXPORT_ES6
      var moduleArgs = {
#else
      var Module = {
#endif
        arguments: gameArgs,
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        printErr(...args) {
          console.error(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        preRun: [function () {
          addRunDependency('idb-settings');
          try { FS.mkdir('/persist'); } catch (e) {}
          FS.mount(IDBFS, {}, '/persist');
          FS.syncfs(true, function (err) {
            console.log(err ? ('IDBFS load failed: ' + err) : 'IDBFS load complete');
            removeRunDependency('idb-settings');
          });
        }],
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      // One sync at a time. A second save while the first is still flushing
      // runs again when the first finishes, so the latest INI is what lands
      // in IndexedDB.
      window.bfPersist = function () {
        if (typeof FS === 'undefined' || !FS.syncfs)
          return;
        if (!window.bfPersistState)
          window.bfPersistState = { busy: false, again: false };
        var st = window.bfPersistState;
        function kick() {
          if (st.busy) { st.again = true; return; }
          st.busy = true;
          FS.syncfs(false, function (err) {
            st.busy = false;
            console.log(err ? ('IDBFS save failed: ' + err) : 'IDBFS save complete');
            if (st.again) { st.again = false; kick(); }
          });
        }
        kick();
      };
      window.addEventListener('beforeunload', function () {
        window.bfPersist();
      });

      setStatus('Downloading...');

      // Open the relay now, while wasm and the data file are still downloading.
      // A free Render instance can take about a minute to wake; this throwaway
      // socket overlaps that with the download. The game opens its own socket
      // later. ?relay= matches the client: off/none/0/empty disables it.
      (function () {
        var url = '';
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.has('relay')) {
            url = params.get('relay') || '';
            if (url === 'off' || url === 'none' || url === '0')
              url = '';
          } else if (typeof Module !== 'undefined' && Module['relay']) {
            url = Module['relay'];
          } else {
            url = 'wss://bitfighter-relay.onrender.com';
          }
        } catch (e) {
          url = 'wss://bitfighter-relay.onrender.com';
        }
        if (!url)
          return;
        var started = Date.now();
        function attempt() {
          if (Date.now() - started > 90000)
            return;
          var ws;
          try { ws = new WebSocket(url); }
          catch (e) { setTimeout(attempt, 2000); return; }
          ws.onopen = function () { console.log('UDP relay warmup open'); };
          ws.onclose = function () {
            if (Date.now() - started < 90000)
              setTimeout(attempt, 2000);
          };
        }
        attempt();
      })();
      window.onerror = window.onunhandledrejection = (e) => {
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        console.error(e);
        setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
#if MODULARIZE && !EXPORT_ES6
    <script type='text/javascript'>
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
  </body>
</html>
